services:
  dicomflow:
    # Local default: build from Dockerfile.
    # To use GHCR instead of building:
    #   image: ghcr.io/alexwuyh/dicomflow:latest
    #   # and comment out "build: ."
    build: .
    image: ${DICOMFLOW_IMAGE:-dicomflow:local}
    container_name: dicomflow
    ports:
      - "8765:8765"
    environment:
      DICOMFLOW_HOST: "0.0.0.0"
      DICOMFLOW_PORT: "8765"
      DICOMFLOW_DATA_DIR: "/data"
      DICOMFLOW_WEB_DIR: "/app/web"
      # 单任务串行，避免 CT 转换占满内存
      DICOMFLOW_WORKERS: "1"
      # 公网务必设置强令牌；本地可留空
      DICOMFLOW_ACCESS_TOKEN: "${DICOMFLOW_ACCESS_TOKEN:-}"
      # 人机验证（Turnstile）可开关；开启时需 site key + TURNSTILE_SECRET
      DICOMFLOW_CAPTCHA_ENABLED: "${DICOMFLOW_CAPTCHA_ENABLED:-false}"
      DICOMFLOW_TURNSTILE_SITE_KEY: "${DICOMFLOW_TURNSTILE_SITE_KEY:-}"
      # Canonical Spin / Cloudflare secret name
      TURNSTILE_SECRET: "${TURNSTILE_SECRET:-}"
      # Optional legacy alias
      DICOMFLOW_TURNSTILE_SECRET_KEY: "${DICOMFLOW_TURNSTILE_SECRET_KEY:-}"
      DICOMFLOW_ENABLE_DOCS: "false"
      DICOMFLOW_RATE_LIMIT_RPM: "60"
      DICOMFLOW_RATE_LIMIT_UPLOADS_PER_HOUR: "20"
      # 生产示例: DICOMFLOW_ALLOWED_HOSTS=dicomflow.example.com
      DICOMFLOW_ALLOWED_HOSTS: "*"
      # 上传/转换结果保留时长（小时）
      DICOMFLOW_JOB_TTL_HOURS: "24"
      DICOMFLOW_CLEANUP_INTERVAL_SECONDS: "900"
      # 仅在可信反向代理后设为 true
      DICOMFLOW_TRUST_X_FORWARDED_FOR: "false"
    volumes:
      # 任务上传/解压/输出持久化
      - dicomflow-data:/data
      # 可选：把本地测试压缩包挂进容器（只读）
      - ./input:/input:ro
      # 开发时热更新前端（改 web/ 无需重建镜像）
      - ./web:/app/web:ro
    # 大文件上传与长转换：放宽健康检查启动时间
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  dicomflow-data:
