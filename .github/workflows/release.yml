# Release packaging: triggered on every push to main (release branch).
# - Always: test + build wheel/sdist + upload workflow artifacts
# - When tag v{version} does not exist yet: create GitHub Release with packages
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools and package
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --tb=short

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${VERSION}"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dicomflow-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Check whether release tag already exists
        id: tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists — skip creating a new GitHub Release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} is new — will create GitHub Release"
          fi

      - name: Create GitHub Release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "${TAG}" dist/* \
            --title "${TAG}" \
            --generate-notes \
            --target "${{ github.sha }}"

      - name: Summary
        run: |
          {
            echo "## Release packaging"
            echo ""
            echo "- **version:** \`${{ steps.version.outputs.version }}\`"
            echo "- **tag:** \`${{ steps.version.outputs.tag }}\`"
            echo "- **commit:** \`${{ github.sha }}\`"
            echo "- **artifacts:** wheel + sdist uploaded to this workflow run"
            if [ "${{ steps.tag.outputs.exists }}" = "true" ]; then
              echo "- **GitHub Release:** skipped (tag already exists). Bump version in \`pyproject.toml\` for a new release tag."
            else
              echo "- **GitHub Release:** created → https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
