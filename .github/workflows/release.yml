# Release packaging: triggered on every push to main (release branch).
# - Always: test + build wheel/sdist + Docker image → GHCR
# - When tag v{version} does not exist yet: create GitHub Release with packages
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools and package
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --tb=short

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          # GHCR image names must be lowercase
          IMAGE="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${VERSION}"
          echo "Container image: ${IMAGE}"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dicomflow-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=DicomFlow
            org.opencontainers.image.description=Local-first DICOM archive to MP4/GIF converter
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check whether release tag already exists
        id: tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists — skip creating a new GitHub Release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} is new — will create GitHub Release"
          fi

      - name: Create GitHub Release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          IMAGE="${{ steps.version.outputs.image }}"
          VERSION="${{ steps.version.outputs.version }}"
          cat > /tmp/release-notes.md <<EOF
          ## DicomFlow ${TAG}

          ### Container image (GHCR)

          \`\`\`bash
          docker pull ${IMAGE}:${VERSION}
          docker pull ${IMAGE}:latest
          \`\`\`

          Package: https://github.com/${{ github.repository }}/pkgs/container/dicomflow

          ### Python packages

          Wheel and sdist are attached to this release.
          EOF
          # strip heredoc indentation
          sed -i 's/^          //' /tmp/release-notes.md
          gh release create "${TAG}" dist/* \
            --title "${TAG}" \
            --notes-file /tmp/release-notes.md \
            --target "${{ github.sha }}"

      - name: Summary
        run: |
          {
            echo "## Release packaging"
            echo ""
            echo "- **version:** \`${{ steps.version.outputs.version }}\`"
            echo "- **tag:** \`${{ steps.version.outputs.tag }}\`"
            echo "- **commit:** \`${{ github.sha }}\`"
            echo "- **Python artifacts:** wheel + sdist (workflow artifacts + release assets when new tag)"
            echo "- **GHCR image:** \`${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}\`"
            echo "- **GHCR latest:** \`${{ steps.version.outputs.image }}:latest\`"
            if [ "${{ steps.tag.outputs.exists }}" = "true" ]; then
              echo "- **GitHub Release:** skipped (tag already exists). Bump version in \`pyproject.toml\` for a new release tag."
            else
              echo "- **GitHub Release:** created → https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
